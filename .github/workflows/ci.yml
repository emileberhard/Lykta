name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
      - name: Dependencies come only from Apple
        run: "! grep '\"location\"' Gateway/Package.resolved | grep -v '\"https://github.com/apple/'"
      - run: swift test --package-path Core
      - run: swift test --package-path Gateway --force-resolved-versions
