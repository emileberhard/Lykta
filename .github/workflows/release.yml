name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that this is the newest version on main
        run: |
          [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$VERSION is not MAJOR.MINOR.PATCH."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$VERSION is not on main."; exit 1; }
          [[ $(git cat-file -t "refs/tags/$VERSION") == tag ]] || { echo "::error::Release tags must be annotated."; exit 1; }
          message=$(git for-each-ref --format='%(contents)' "refs/tags/$VERSION")
          [[ $message =~ [^[:space:]] ]] || { echo "::error::The $VERSION tag has no release notes."; exit 1; }
          newest=$(git tag --list | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)
          [[ $newest == "$VERSION" ]] || { echo "::error::$newest is newer than $VERSION."; exit 1; }

      - name: Check that new layout features ship in this minor release
        run: scripts/check-feature-table "$VERSION"

      - name: Wait for CI to pass on this commit
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$SECONDS
          while :; do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$GITHUB_SHA" --json status,conclusion \
              --jq 'if any(.[]; .conclusion == "success") then "passed" elif any(.[]; .status != "completed") then "running" elif length > 0 then "failed" else "missing" end') \
              || state=unknown
            case $state in
              passed) exit 0 ;;
              failed) echo "::error::CI failed on $GITHUB_SHA."; exit 1 ;;
              missing) (( SECONDS - started < 120 )) || { echo "::error::No CI run exists for $GITHUB_SHA; tag the commit a push to main ended on."; exit 1; } ;;
            esac
            sleep 10
          done

  gateway:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      attestations: write
      id-token: write
      statuses: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      LYKTA_GATEWAY_HOST: ${{ vars.LYKTA_GATEWAY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark gateway deployment pending
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context="lykta-gateway/$VERSION" -f description='Building the gateway release'
      - name: Build the Linux gateway
        run: |
          docker build --target build --build-arg JOBS=4 -t lykta-gateway-release .
          container=$(docker create lykta-gateway-release)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/lykta-gateway" "$RUNNER_TEMP/lykta-gateway-linux-amd64"
      - name: Attest the gateway binary
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/lykta-gateway-linux-amd64
      - name: Publish the gateway and release notes
        run: |
          cp '${{ steps.attestation.outputs.bundle-path }}' "$RUNNER_TEMP/lykta-gateway-linux-amd64.sigstore.json"
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha)
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$RUNNER_TEMP/notes.md"
            [[ -s "$RUNNER_TEMP/notes.md" ]]
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          release=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          for name in lykta-gateway-linux-amd64 lykta-gateway-linux-amd64.sigstore.json; do
            artifact="$RUNNER_TEMP/$name"
            expected="sha256:$(sha256sum "$artifact" | cut -d ' ' -f 1)"
            existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release" --jq ".assets[] | select(.name == \"$name\") | .digest")
            if [[ -z "$existing" ]]; then
              gh release upload "$VERSION" "$artifact" --repo "$GITHUB_REPOSITORY"
            elif [[ "$name" != *.sigstore.json ]]; then
              [[ "$existing" == "$expected" ]] || { echo 'Existing gateway asset has a different digest.' >&2; exit 1; }
            fi
          done
          if [[ $(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) == true ]]; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
      - name: Wait for the public gateway
        timeout-minutes: 31
        run: scripts/wait-for-gateway
      - name: Record the gateway result
        if: always()
        run: |
          state=failure
          [[ '${{ job.status }}' == success ]] && state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f "state=$state" -f context="lykta-gateway/$VERSION" -f description="Gateway deploy $state"

  numbers:
    needs: admit
    runs-on: ubuntu-24.04
    environment: testflight
    timeout-minutes: 10
    outputs:
      build: ${{ steps.reserve.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve the next global build number
        id: reserve
        env:
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$APP_STORE_CONNECT_KEY_PATH"
          echo "build=$(scripts/app-store-connect next-build-number)" >> "$GITHUB_OUTPUT"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  testflight:
    needs: [admit, numbers, gateway]
    runs-on: xcode-27
    environment: testflight
    concurrency: testflight
    outputs:
      build: ${{ steps.build.outputs.number }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      statuses: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/select-xcode

      - name: Configure
        env:
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
          LYKTA_GATEWAY_HOST: ${{ vars.LYKTA_GATEWAY_HOST }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          : "${DEVELOPMENT_TEAM:?Set the DEVELOPMENT_TEAM environment variable.}"
          : "${LYKTA_BUNDLE_ID:?Set the LYKTA_BUNDLE_ID environment variable.}"
          : "${LYKTA_GATEWAY_HOST:?Set the LYKTA_GATEWAY_HOST environment variable.}"
          printf 'DEVELOPMENT_TEAM = %s\nLYKTA_BUNDLE_ID = %s\nLYKTA_GATEWAY_HOST = %s\n' \
            "$DEVELOPMENT_TEAM" "$LYKTA_BUNDLE_ID" "$LYKTA_GATEWAY_HOST" > iOS/Config/Local.xcconfig
          plutil -insert teamID -string "$DEVELOPMENT_TEAM" iOS/Config/ExportOptions.plist
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Check whether an earlier attempt started uploading
        id: fence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fenced=false
          for ((attempt = 1; attempt < GITHUB_RUN_ATTEMPT; attempt++)); do
            started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs" \
              --jq '[.jobs[] | select(.name == "testflight") | .steps[] | select(.name == "Upload to TestFlight" and .conclusion != "skipped" and .started_at != null)] | length')
            (( started == 0 )) || fenced=true
          done
          echo "fenced=$fenced" >> "$GITHUB_OUTPUT"

      - name: Select the build number, or the build an earlier attempt uploaded
        id: build
        env:
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          FENCED: ${{ steps.fence.outputs.fenced }}
          RESERVED: ${{ needs.numbers.outputs.build }}
        run: |
          result=$(scripts/app-store-connect build-number "$VERSION" "$RESERVED" "$([[ $FENCED == true ]] && echo fenced || echo open)")
          read -r number state <<< "$result"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "uploaded=$([[ $state == uploaded ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Archive
        if: steps.build.outputs.uploaded != 'true'
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
        run: |
          xcodebuild archive -quiet -project iOS/Lykta.xcodeproj -scheme Lykta -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Lykta.xcarchive" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          app="$RUNNER_TEMP/Lykta.xcarchive/Products/Applications/Lykta.app"
          scripts/sign-bundles sign "$app"

      - name: Wait for the production gateway to run this version
        timeout-minutes: 31
        env:
          GH_TOKEN: ${{ github.token }}
          LYKTA_GATEWAY_HOST: ${{ vars.LYKTA_GATEWAY_HOST }}
        run: scripts/wait-for-gateway

      - name: Check the entitlements
        if: steps.build.outputs.uploaded != 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
        run: |
          plutil -replace destination -string export -o "$RUNNER_TEMP/check.plist" iOS/Config/ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Lykta.xcarchive" -exportPath "$RUNNER_TEMP/check" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates \
            -exportOptionsPlist "$RUNNER_TEMP/check.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          unzip -q "$RUNNER_TEMP/check/Lykta.ipa" -d "$RUNNER_TEMP/check"
          scripts/sign-bundles check "$RUNNER_TEMP/check/Payload/Lykta.app"

      - name: Upload to TestFlight
        if: steps.build.outputs.uploaded != 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Lykta.xcarchive" -exportPath "$RUNNER_TEMP/upload" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates \
            -exportOptionsPlist iOS/Config/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

  testflight-review:
    needs: testflight
    runs-on: ubuntu-24.04
    environment: testflight
    timeout-minutes: 45
    env:
      VERSION: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ needs.testflight.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Submit the build for TestFlight review
        env:
          GH_TOKEN: ${{ github.token }}
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$APP_STORE_CONNECT_KEY_PATH"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$RUNNER_TEMP/notes.md"
          scripts/app-store-connect testflight "$VERSION" "$BUILD_NUMBER" "$RUNNER_TEMP/notes.md"

  app-store:
    needs: testflight
    runs-on: xcode-27
    environment: testflight
    concurrency: app-store
    timeout-minutes: 60
    env:
      VERSION: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ needs.testflight.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/select-xcode

      - name: Compose the screenshots
        run: scripts/screenshots

      - name: Prepare the App Store version
        env:
          GH_TOKEN: ${{ github.token }}
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$APP_STORE_CONNECT_KEY_PATH"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$RUNNER_TEMP/notes.md"
          scripts/app-store-connect app-store "$VERSION" "$BUILD_NUMBER" .local/screenshots "$RUNNER_TEMP/notes.md"

  github-release:
    needs: [admit, testflight, gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Promote the gateway prerelease
        run: |
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)
          latest=true
          [[ "$VERSION" == "$newest" ]] || latest=false
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest="$latest"
