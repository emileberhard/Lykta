name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read


jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that this is the newest version on main
        run: |
          [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$VERSION is not MAJOR.MINOR.PATCH."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$VERSION is not on main."; exit 1; }
          newest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          [[ $newest == "$VERSION" ]] || { echo "::error::$newest is newer than $VERSION."; exit 1; }

      - name: Check that new layout features ship in this minor release
        run: scripts/check-feature-table "$VERSION"

      - name: Wait for CI to pass on this commit
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$GITHUB_SHA" --json status,conclusion \
              --jq 'if any(.[]; .conclusion == "success") then "passed" elif any(.[]; .status != "completed") then "running" elif length > 0 then "failed" else "missing" end') \
              || state=unknown
            case $state in
              passed) exit 0 ;;
              failed) echo "::error::CI failed on $GITHUB_SHA."; exit 1 ;;
              *) sleep 10 ;;
            esac
          done

  testflight:
    runs-on: xcode-27
    environment: testflight
    concurrency: testflight
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      VERSION: ${{ github.ref_name }}
      ENTITLED: PlugIns/LyktaNotifications.appex=Notifications .=Lykta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        env:
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
          LYKTA_GATEWAY_HOST: ${{ vars.LYKTA_GATEWAY_HOST }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          printf 'DEVELOPMENT_TEAM = %s\nLYKTA_BUNDLE_ID = %s\nLYKTA_GATEWAY_HOST = %s\n' \
            "$DEVELOPMENT_TEAM" "$LYKTA_BUNDLE_ID" "$LYKTA_GATEWAY_HOST" > iOS/Config/Local.xcconfig
          plutil -insert teamID -string "$DEVELOPMENT_TEAM" iOS/Config/ExportOptions.plist
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
        run: |
          xcodebuild archive -quiet -project iOS/Lykta.xcodeproj -scheme Lykta -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Lykta.xcarchive" \
            MARKETING_VERSION="$VERSION" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          app="$RUNNER_TEMP/Lykta.xcarchive/Products/Applications/Lykta.app"
          codesign --force --sign - "$app/PlugIns/LyktaWidgets.appex"
          for bundle in $ENTITLED; do
            sed "s/\$(LYKTA_BUNDLE_ID)/$LYKTA_BUNDLE_ID/g" "iOS/Config/${bundle#*=}.entitlements" > "$RUNNER_TEMP/${bundle#*=}.entitlements"
            codesign --force --sign - --entitlements "$RUNNER_TEMP/${bundle#*=}.entitlements" "$app/${bundle%=*}"
          done

      - name: Wait for the production gateway to run this version
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          LYKTA_GATEWAY_HOST: ${{ vars.LYKTA_GATEWAY_HOST }}
        run: |
          while :; do
            admit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "admit") | .conclusion // "pending"')
            case $admit in
              success)
                running=$(curl -fsS --max-time 10 "https://$LYKTA_GATEWAY_HOST/v1/version" | plutil -extract version raw -o - -) || running=unknown
                [[ $running =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $(printf '%s\n' "$VERSION" "$running" | sort -V | tail -1) == "$running" ]] && exit 0
                echo "The gateway runs $running; waiting for $VERSION or newer." ;;
              pending | "") echo "Waiting for release admission." ;;
              *) echo "::error::Release admission ended with $admit."; exit 1 ;;
            esac
            sleep 15
          done

      - name: Sign, check the entitlements and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export_archive() {
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Lykta.xcarchive" -exportPath "$RUNNER_TEMP/$1" \
              -exportOptionsPlist "$RUNNER_TEMP/$1.plist" -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          }
          plutil -replace destination -string export -o "$RUNNER_TEMP/check.plist" iOS/Config/ExportOptions.plist
          cp iOS/Config/ExportOptions.plist "$RUNNER_TEMP/upload.plist"
          export_archive check
          unzip -q "$RUNNER_TEMP/check/Lykta.ipa" -d "$RUNNER_TEMP/check"
          for bundle in $ENTITLED; do
            want=$(plutil -convert json -o - "$RUNNER_TEMP/${bundle#*=}.entitlements" |
              jq 'if has("aps-environment") then ."aps-environment" = "production" else . end')
            codesign -d --entitlements - --xml "$RUNNER_TEMP/check/Payload/Lykta.app/${bundle%=*}" | plutil -convert json -o - - |
              jq -e --argjson want "$want" '. as $actual | all($want | to_entries[]; $actual[.key] == .value)' > /dev/null ||
              { echo "::error::The exported ${bundle%=*} does not claim ${bundle#*=}.entitlements."; exit 1; }
          done
          export_archive upload

  app-store:
    needs: testflight
    runs-on: xcode-27
    environment: testflight
    concurrency: app-store
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose the screenshots
        run: scripts/screenshots

      - name: Submit the build for TestFlight review and prepare the App Store version
        env:
          GH_TOKEN: ${{ github.token }}
          LYKTA_BUNDLE_ID: ${{ vars.LYKTA_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$APP_STORE_CONNECT_KEY_PATH"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$RUNNER_TEMP/notes.md"
          scripts/app-store-connect "$VERSION" .local/screenshots "$RUNNER_TEMP/notes.md"

  github-release:
    needs: [admit, testflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Publish the tag message as the release notes
        run: |
          tag=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha)
          gh api "repos/$GH_REPO/git/tags/$tag" --jq .message | gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file -
