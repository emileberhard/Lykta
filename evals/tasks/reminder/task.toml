artifacts = [{ source = "/tmp/events.json", destination = "events.json" }]

[agent]
timeout_sec = 300

[[verifier.collect]]
command = "curl -fsS --max-time 5 'http://lykta:8080/v1/events?after=0&limit=1000' -H 'Authorization: Bearer lykta_agent_9e2b7c4f1a8d3e6b0c5f9a2d7e4b1c8f3a6d0e9b2c5f8a1d4e7b0c3f6a9d2e5b' -o /tmp/events.json"
